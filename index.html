<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockMarket Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginPage">
        <div class="login-box">
            <div class="login-logo">
                <i class="fas fa-chart-line"></i>
                <h1>StockMarket</h1>
                <p>Play. Trade. Learn.</p>
            </div>
            <div class="tab-btns">
                <button class="active" onclick="showLoginForm()">Login</button>
                <button onclick="showRegisterForm()">Register</button>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>
            <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create password" required>
                </div>
                <button type="submit" class="btn-primary"><i class="fas fa-user-plus"></i> Create Account</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

    <script>
        // ===== USER MANAGEMENT =====
        const USERS_KEY = 'smg_users';
        const CURRENT_USER_KEY = 'smg_current_user';

        function getUsers() { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); }
        function saveUsers(users) { localStorage.setItem(USERS_KEY, JSON.stringify(users)); }

        function getCurrentUser() {
            const userId = localStorage.getItem(CURRENT_USER_KEY);
            if (!userId) return null;
            const users = getUsers();
            return users.find(u => u.id === userId) || null;
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.className = 'toast show' + (type === 'error' ? ' error' : '');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.querySelector('.tab-btns button:first-child').classList.add('active');
            document.querySelector('.tab-btns button:last-child').classList.remove('active');
        }

        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.querySelector('.tab-btns button:first-child').classList.remove('active');
            document.querySelector('.tab-btns button:last-child').classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);
            if (!user) {
                showToast('Invalid email or password', 'error');
                return;
            }
            localStorage.setItem(CURRENT_USER_KEY, user.id);
            showToast('Login successful! Redirecting...');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 500);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const users = getUsers();
            if (users.find(u => u.email === email)) {
                showToast('Email already registered', 'error');
                return;
            }
            const user = {
                id: 'u_' + Date.now(),
                name,
                email,
                password,
                coins: 20000,
                portfolio: {}
            };
            users.push(user);
            saveUsers(users);
            localStorage.setItem(CURRENT_USER_KEY, user.id);
            showToast('Account created! Redirecting...');
            setTimeout(() => {
                window.location.href = 'home.html';
            }, 500);
        }

        // If already logged in, skip login
        if (getCurrentUser()) {
            window.location.href = 'home.html';
        }
    </script>
</body>
</html>
