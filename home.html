<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMarket Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo" onclick="window.location.href='home.html'">
                <i class="fas fa-chart-line"></i>
                <span>StockMarket</span>
            </div>
            <div class="header-right">
                <div class="update-timer">
                    <i class="fas fa-clock"></i>
                    <span id="countdown">2:00</span>
                </div>
                <div class="coins-badge">
                    <i class="fas fa-coins"></i>
                    <span id="headerCoins">20,000</span>
                </div>
            </div>
        </header>

        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search stocks & banks..." onkeydown="if(event.key==='Enter'){window.location.href='search.html?query='+encodeURIComponent(this.value)}">
            </div>
        </div>

        <div class="main-content">
            <div class="stock-section">
                <div class="filter-tabs">
                    <button class="active" onclick="setFilter('all')">All</button>
                    <button onclick="setFilter('stock')">Top Stocks</button>
                    <button onclick="setFilter('bank')">Banks</button>
                </div>
                <div class="stock-list" id="stockList"></div>
            </div>

            <div class="portfolio-section">
                <h3><i class="fas fa-wallet"></i> My Portfolio</h3>
                <div class="portfolio-coins">
                    <i class="fas fa-coins"></i>
                    <div class="coins-label">Available Coins</div>
                    <div class="coins-amount" id="portfolioCoins">20,000</div>
                </div>
                <div class="portfolio-list" id="portfolioList"></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="search.html" class="nav-item">
                <i class="fas fa-search"></i>
                <span>Search</span>
            </a>
            <a href="stock.html" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Stock</span>
            </a>
            <a href="account.html" class="nav-item">
                <i class="fas fa-user-circle"></i>
                <span>Account</span>
            </a>
        </nav>
    </div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <script src="script.js"></script>
</body>
</html>
